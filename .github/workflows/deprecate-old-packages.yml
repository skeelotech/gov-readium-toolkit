name: Deprecate old skeelo packages (one-shot)
on:
  workflow_dispatch:
jobs:
  deprecate:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Deprecate old packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GOV_GH_PACKAGES_PAT }}
        run: |
          set -e
          # Write npmrc with token for GitHub Packages
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          echo "@skeelotech:registry=https://npm.pkg.github.com" >> ~/.npmrc

          deprecate_pkg() {
            local SPEC="$1"
            local MSG="$2"
            echo "Deprecating $SPEC ..."
            npm deprecate "$SPEC" "$MSG" --registry=https://npm.pkg.github.com || {
              echo "  WARNING: npm deprecate failed for $SPEC (may not be supported by GitHub Packages)"
              return 0
            }
            echo "  Done: $SPEC"
          }

          deprecate_pkg "@skeelotech/readium-navigator@2.5.4-skeelo.1" "renamed to @skeelotech/gov-readium-navigator"
          deprecate_pkg "@skeelotech/readium-shared@2.2.0-skeelo.1" "renamed to @skeelotech/gov-readium-shared"
          deprecate_pkg "@skeelotech/readium-navigator-html-injectables@2.4.2-skeelo.1" "renamed to @skeelotech/gov-readium-navigator-html-injectables"
          deprecate_pkg "@skeelotech/readium-css@2.0.5-skeelo.1" "renamed to @skeelotech/gov-readium-css"
          deprecate_pkg "@skeelotech/thorium-web@1.5.0-skeelo.1" "renamed to @skeelotech/gov-thorium-web"

          echo "OK"
