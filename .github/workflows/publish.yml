name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*-gov.*'   # triggers on tags like v2.5.4-gov.1
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gov

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@skeelotech'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: |
          pnpm --filter @skeelotech/gov-readium-shared run build
          pnpm --filter @skeelotech/gov-readium-navigator-html-injectables run build
          pnpm --filter @skeelotech/gov-readium-navigator run build

      - name: Publish packages
        run: |
          pnpm --filter @skeelotech/gov-readium-shared publish --no-git-checks
          pnpm --filter @skeelotech/gov-readium-navigator-html-injectables publish --no-git-checks
          pnpm --filter @skeelotech/gov-readium-navigator publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
